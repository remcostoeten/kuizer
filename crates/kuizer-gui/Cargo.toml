[package]
name = "kuizer-gui"
version.workspace = true
edition = "2024"
description = "Desktop interface for kuizer, built on GPUI"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/remcostoeten/kuizer"
homepage = "https://github.com/remcostoeten/kuizer"
keywords = ["cleanup", "disk", "gui", "gpui"]
categories = ["filesystem", "gui"]

[[bin]]
name = "kuizer-gui"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
kuizer = { path = "../..", version = "0.1.0" }

[package.metadata.dist]
installers = ["shell"]
include = ["../../packaging/kuizer-gui.desktop", "../../packaging/kuizer-gui.svg"]

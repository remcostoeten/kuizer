# Developer tool caches.

[[entry]]
name = "npm"
app = "npm"
group = "developer"
base = "home"
path = ".npm/_cacache"
safety = "safe"

[[entry]]
name = "npx"
app = "npm"
group = "developer"
base = "home"
path = ".npm/_npx"
safety = "safe"

[[entry]]
name = "pnpm-store"
app = "pnpm"
group = "developer"
base = "data"
path = "pnpm/store"
safety = "review"
note = "node_modules folders hard-link into the store, so only packages no project uses are freed; `pnpm store prune` removes just those"


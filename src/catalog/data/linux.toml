# Linux desktop, system and app caches.

[[entry]]
name = "thumbnails"
app = "Desktop"
group = "system"
base = "cache"
path = "thumbnails"
safety = "safe"
platforms = ["linux"]
note = "File previews rebuilt on demand by file managers."

[[entry]]
name = "fontconfig-cache"
app = "Fontconfig"
group = "system"
base = "cache"
path = "fontconfig"
safety = "safe"
platforms = ["linux"]
note = "Font metadata caches rebuilt on next use."

[[entry]]
name = "mesa-shader-cache"
app = "Mesa"
group = "system"
base = "cache"
path = "mesa_shader_cache"
safety = "safe"
platforms = ["linux"]
note = "Compiled GPU shaders; games may stutter once while it refills."

[[entry]]
name = "mesa-shader-cache-db"
app = "Mesa"
group = "system"
base = "cache"
path = "mesa_shader_cache_db"
safety = "safe"
platforms = ["linux"]
note = "Compiled GPU shaders in the single-database layout; games may stutter once while it refills."

[[entry]]
name = "nvidia-gl-cache"
app = "NVIDIA driver"
group = "system"
base = "cache"
path = "nvidia/GLCache"
safety = "safe"
platforms = ["linux"]
note = "Compiled shaders of the NVIDIA driver."

[[entry]]
name = "nvidia-compute-cache"
app = "NVIDIA driver"
group = "system"
base = "home"
path = ".nv/ComputeCache"
safety = "safe"
platforms = ["linux"]
note = "Compiled CUDA kernels rebuilt on next run."

[[entry]]
name = "gstreamer-registry"
app = "GStreamer"
group = "system"
base = "cache"
path = "gstreamer-1.0"
safety = "safe"
platforms = ["linux"]
note = "Plugin registry rebuilt at next start."

[[entry]]
name = "tracker-index"
app = "GNOME search"
group = "system"
base = "cache"
path = "tracker3"
safety = "review"
platforms = ["linux"]
processes = ["localsearch-3", "tracker-miner-f"]
note = "Search index rebuilt by indexing all files again, which takes a while."

[[entry]]
name = "baloo-index"
app = "KDE search"
group = "system"
base = "data"
path = "baloo"
safety = "review"
platforms = ["linux"]
processes = ["baloo_file"]
note = "Search index rebuilt by indexing all files again; turn indexing off first if you do not use it."

[[entry]]
name = "flatpak-app-caches"
app = "Flatpak apps"
group = "apps"
base = "home"
path = ".var/app/*/cache"
safety = "review"
platforms = ["linux"]
note = "Cache folder of each Flatpak app; check which app owns it first."

[[entry]]
name = "spotify-cache"
app = "Spotify"
group = "apps"
base = "cache"
path = "spotify"
safety = "review"
platforms = ["linux"]
processes = ["spotify"]
note = "Streaming cache and downloaded songs; downloads must be fetched again."

[[entry]]
name = "steam-shader-cache"

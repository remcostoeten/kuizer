name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev
      - name: Check the tag matches the crate version
        run: |
          version="$(cargo pkgid -p kuizer | sed 's/.*[#@]//')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: cargo build --release --locked --workspace
      - run: packaging/package.sh "${GITHUB_REF_NAME#v}" "$TARGET" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes

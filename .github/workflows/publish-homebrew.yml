name: publish-homebrew

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point Formula/kuizer.rb and Casks/kuizer-gui.rb at, such as v0.1.3
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ inputs.plan }}
      TAG: ${{ inputs.tag }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Render formula and cask
        id: render
        run: |
          if [ -z "$TAG" ]; then
            if [ "$(jq --raw-output '.announcement_is_prerelease' <<<"$PLAN")" = true ]; then
              echo "Prerelease: the formula and cask stay on the last stable release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG=$(jq --raw-output '.announcement_tag' <<<"$PLAN")
          fi
          version=${TAG#v}

          checksums="$RUNNER_TEMP/checksums"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$checksums" --pattern '*.tar.xz.sha256'
          bash packaging/homebrew/render.sh "$version" "$checksums" .

          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit to the default branch
        if: steps.render.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kuizer.rb Casks/kuizer-gui.rb
          if git diff --cached --quiet; then
            echo "Formula and cask already point at $VERSION"
            exit 0
          fi
          git commit --message "Point the Homebrew formula and cask at $VERSION [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed, rebasing onto $BRANCH"
            git pull --rebase origin "$BRANCH"
          done
          exit 1

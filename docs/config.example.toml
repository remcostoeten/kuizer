# Copy to ~/.config/kuizer/config.toml. Every key is optional.

[scan]
roots = ["~/projects", "~/work"]
exclude = ["~/projects/archive/**", "vendor"]
exclude_extensions = ["iso"]
skip_dirs = [".git", ".hg", ".svn", ".jj"]
ignore_file = ".kuizerignore"
min_size = "1MB"
# Omit for unlimited depth.
max_depth = 16
one_file_system = true
excluded_fs_types = [
  "proc", "sysfs", "devtmpfs", "devpts", "cgroup", "cgroup2",
  "securityfs", "debugfs", "tracefs", "pstore", "bpf", "configfs",
  "fusectl", "mqueue", "hugetlbfs", "autofs", "binfmt_misc", "efivarfs",
  "nsfs", "nfs", "nfs4", "cifs", "smb3", "fuse.sshfs",
]
excluded_mounts = ["/proc", "/sys", "/dev", "/run"]
# 0 picks a default from the core count; values above 64 are capped with a warning.
size_threads = 0

[detect]
categories = ["dependencies", "build", "cache", "temp"]
builtin_rules = true
disabled_rules = ["js-out"]

[[rules]]
name = "jekyll-site"
kind = "dir"
pattern = "_site"
markers = ["_config.yml"]
contains = ["index.html"]
category = "build"
safety = "review"
ecosystem = "jekyll"

# The GUI searches for duplicate files on request, from the Duplicates section or the
# command palette. With enabled = true it also searches after every scan, once the
# rest of the results are on screen. `kuizer duplicates` is not affected.
[duplicates]
enabled = false
min_size = "4KiB"
threads = 0
verify = false
# Files in hidden home folders (~/.cache, ~/.rustup) and tool-managed folders (Go modules)
# are skipped unless this is true; a scan root inside one still looks there.
include_hidden = false

# mode = "permanent" deletes for good. mode = "trash" moves project artifacts and caches to
# the trash, where `kuizer restore` can bring them back; toolchains, Docker objects and git
# branches are always removed for good. With confirm = false the TUI deletes safe items
# straight away; review items and projects with uncommitted changes still ask.
[delete]
mode = "permanent"
confirm = true
# Extra existing absolute directories the deletion guard refuses.
protected = []
# Allow deleting a selected directory across a filesystem boundary. Defaults to false.
cross_device = false
# Git repositories found under the scan roots. kuizer lists a repository when `git gc`
# would free at least min_gain, or when it has local branches already merged into its
# default branch. Neither action can be undone from the trash.
[git]
min_gain = "1MiB"
aggressive = false
keep_branches = ["main", "master", "develop", "trunk"]
threads = 0

[appearance]
motion = true
# "expanded" shows the GUI sidebar with labels, "collapsed" opens it as a strip of icons.
# Ctrl+B (Cmd+B on macOS) switches between the two while the app runs.
sidebar = "expanded"
# "dark" or "light". The light theme uses an off-white background.
theme = "dark"
# "purple", "blue", "teal" or "pink": the color of the selection, the focus outline and the bars.
accent = "purple"
# "comfortable" or "compact": compact uses shorter list rows and less vertical padding.
density = "comfortable"
# Interface size in percent, from 50 to 200. Ctrl+= and Ctrl+- (Cmd on macOS) change it in steps
# of ten while the app runs and save the new size here.
zoom = 100

# The keys that open a sidebar section in the GUI (Shift+1 to Shift+9). With enabled = false
# they do nothing; the command palette still opens every section. hints = false hides the
# key badges in the sidebar and in the section tooltips.
[route_shortcuts]
enabled = true
hints = true

[toolchains]
tools = ["rustup", "nvm", "fnm", "volta", "pyenv", "uv", "sdkman", "go"]
pins = true

[docker]
engines = ["docker", "podman"]
timeout_secs = 10
recent_hours = 24

# Override a shortcut with one key or a list of alternatives. Quote action names with dots.
# Each action replaces all its defaults. Shared actions apply in both interfaces.
# Use modifier prefixes such as ctrl-, alt-, shift-, and secondary- (Cmd in the macOS GUI,
# Ctrl in the TUI and on Linux). Named keys include space, enter, escape, and pageup.
# Invalid or conflicting overrides report a warning and keep that action's defaults.
# See src/keymap.rs for the full action list and the contexts where each action works. The
# Keys page of the GUI settings lists every action too, and records and writes new keys here.
[keys]
# "nav.down" = ["n", "down"]
# "nav.up" = ["shift-n", "up"]
# "palette.open" = "secondary-shift-k"

# Named cleanup policies, run with `kuizer clean --policy NAME`.
# Inspect them with `kuizer policy list` and `kuizer policy show NAME`.
# [policy.stale-deps]
# source = "projects"
# paths = ["~/apps"]
# category = ["dependencies", "build"]
# rule = []
# idle = "60d"
# min_size = "50MB"
# exclude = []
# select = "safe"
# permanent = false

# Copy to ~/.config/kuizer/config.toml. Every key is optional.

[scan]
roots = ["~/projects", "~/work"]
exclude = ["~/projects/archive/**", "vendor"]
exclude_extensions = ["iso"]
skip_dirs = [".git", ".hg", ".svn", ".jj"]
ignore_file = ".kuizerignore"
min_size = "1MB"
one_file_system = true
excluded_mounts = ["/proc", "/sys", "/dev", "/run"]
size_threads = 0

[detect]
categories = ["dependencies", "build", "cache", "temp"]
builtin_rules = true
disabled_rules = ["js-out"]

[[rules]]
name = "jekyll-site"
kind = "dir"
pattern = "_site"
markers = ["_config.yml"]
contains = ["index.html"]
category = "build"
safety = "review"
ecosystem = "jekyll"

# The GUI searches for duplicate files on request, from the Duplicates section or the
# command palette. With enabled = true it also searches after every scan, once the
# rest of the results are on screen. `kuizer duplicates` is not affected.
[duplicates]
enabled = false
min_size = "4KiB"
threads = 0
verify = false
# Files in hidden home folders (~/.cache, ~/.rustup) and tool-managed folders (Go modules)
# are skipped unless this is true; a scan root inside one still looks there.
include_hidden = false

[delete]
mode = "trash"
confirm = false

# Git repositories found under the scan roots. kuizer lists a repository when `git gc`
# would free at least min_gain, or when it has local branches already merged into its
# default branch. Neither action can be undone from the trash.
[git]
min_gain = "1MiB"
aggressive = false
keep_branches = ["main", "master", "develop", "trunk"]
threads = 0

[appearance]
motion = true
# "expanded" shows the GUI sidebar with labels, "collapsed" opens it as a strip of icons.
# Ctrl+B (Cmd+B on macOS) switches between the two while the app runs.
sidebar = "expanded"

# The keys that open a sidebar section in the GUI (Shift+1 to Shift+9). With enabled = false
# they do nothing; the command palette still opens every section. hints = false hides the
# key badges in the sidebar and in the section tooltips.
[route_shortcuts]
enabled = true
hints = true

[toolchains]
tools = ["rustup", "nvm", "fnm", "volta", "pyenv", "uv", "sdkman", "go"]
pins = true

[docker]
engines = ["docker", "podman"]
timeout_secs = 10
recent_hours = 24

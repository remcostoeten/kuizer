# Copy to ~/.config/kuizer/config.toml. Every key is optional.

[scan]
roots = ["~/projects", "~/work"]
exclude = ["~/projects/archive/**", "vendor"]
exclude_extensions = ["iso"]
skip_dirs = [".git", ".hg", ".svn", ".jj"]
ignore_file = ".kuizerignore"
min_size = "1MB"
one_file_system = true
excluded_mounts = ["/proc", "/sys", "/dev", "/run"]
size_threads = 0

[detect]
categories = ["dependencies", "build", "cache", "temp"]
builtin_rules = true
disabled_rules = ["js-out"]

[[rules]]
name = "android-build"
kind = "dir"
pattern = "build"
markers = ["build.gradle", "build.gradle.kts"]
contains = ["intermediates", "outputs"]
category = "build"
safety = "review"
ecosystem = "android"

[duplicates]
min_size = "4KiB"
threads = 0
verify = false

[delete]
mode = "trash"
confirm = false

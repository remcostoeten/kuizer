[package]
name = "kuizer"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Keyboard-driven disk cleanup for developers: generated artifacts, caches and duplicates"
license = "MIT"
publish = false

[workspace]
members = [".", "crates/kuizer-gui"]

[workspace.package]
version = "0.1.0"

[[bin]]
name = "kuizer"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
globset = "0.4.20"
jiff = { version = "0.2.38", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.8"
trash = { version = "5.2.9", default-features = false, features = ["chrono", "coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

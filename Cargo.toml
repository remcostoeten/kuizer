[package]
name = "kuizer"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Keyboard-driven disk cleanup for developers: generated artifacts, caches and duplicates"
license = "MIT"
repository = "https://github.com/remcostoeten/kuizer"
homepage = "https://github.com/remcostoeten/kuizer"
readme = "README.md"
keywords = ["cleanup", "disk", "node-modules", "cache", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["/src/**", "/tests/**", "/examples/synth.rs", "/docs/config.example.toml", "/README.md", "/LICENSE"]

[workspace]
members = [".", "crates/kuizer-gui"]

[workspace.package]
version = "0.1.1"

[[bin]]
name = "kuizer"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
globset = "0.4.20"
jiff = { version = "0.2.38", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
trash = { version = "5.2.9", default-features = false, features = ["chrono", "coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/kuizer-{ target }{ archive-suffix }"
bin-dir = "kuizer-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
